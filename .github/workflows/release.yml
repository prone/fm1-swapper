# SPDX-License-Identifier: GPL-3.0-only
# Tag a version (git tag v1.2.3 && git push --tags) to build an unsigned .ipa and the web app zip and attach them to a release.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: FM1Kit tests
        run: cd Packages/FM1Kit && swift test
      - name: Tutorials
        run: python3 tools/validate_tutorials.py
  ipa:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen
      - name: Build unsigned .ipa
        run: |
          set -o pipefail
          mkdir -p build
          tools/build-ipa.sh "${GITHUB_REF_NAME#v}" | tee build/sha256.txt
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "build/FM1Swapper-$V.ipa" --title "FM-1 Swapper $V" \
            --notes-file .github/RELEASE_NOTES.md --prerelease --verify-tag || \
          gh release upload "$GITHUB_REF_NAME" "build/FM1Swapper-$V.ipa" --clobber
  web:
    needs: ipa          # the ipa job creates the release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Build the web app
        working-directory: web
        run: npm ci && npm test && npm run emu && npm run build
      - name: Zip and attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          cp web/START-HERE.txt LICENSE web/dist/
          (cd web/dist && zip -qr "../../FM1Swapper-web-$V.zip" .)
          gh release upload "$GITHUB_REF_NAME" "FM1Swapper-web-$V.zip" --clobber
