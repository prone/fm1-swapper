name: FM1Swapper
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  FM1Kit:
    path: Packages/FM1Kit
settings:
  base:
    DEVELOPMENT_TEAM: YOURTEAMID
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FM1Swapper:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Tutorials
        type: folder
        buildPhase: resources
    dependencies:
      - package: FM1Kit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FM-1 Swapper
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification, audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSSupportsOpeningDocumentsInPlace: false
        ITSAppUsesNonExemptEncryption: false
        FM1CloudSync: $(FM1_CLOUD_SYNC)
        NSBluetoothAlwaysUsageDescription: Connects to Bluetooth MIDI controllers such as the M-VAVE SMC-PAD.
        NSMicrophoneUsageDescription: Records samples for the slice sampler.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.example.fm1swapper.fwsc
            UTTypeDescription: FM-1 firmware package
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [fwsc]
        CFBundleDocumentTypes:
          - CFBundleTypeName: FM-1 firmware package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.example.fm1swapper.fwsc]
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fm1swapper
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        # iCloud sync: set to YES and CODE_SIGN_ENTITLEMENTS to App/FM1Swapper-iCloud.entitlements
        # once Xcode is signed in to the developer account (Settings > Accounts).
        FM1_CLOUD_SYNC: "NO"
