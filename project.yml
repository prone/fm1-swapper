name: FM1Swapper
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  FM1Kit:
    path: Packages/FM1Kit
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FM1Swapper:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: App
        excludes: [AudioImport]
      # the audio import (web/src/audio, built by `npm run build:ios-audio`), served to a hidden web view
      - path: App/AudioImport
        type: folder
        buildPhase: resources
      - path: Tutorials
        type: folder
        buildPhase: resources
      - path: web/public/emu-bridge.js
        buildPhase: resources
    dependencies:
      - package: FM1Kit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FM-1 Swapper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification, audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSSupportsOpeningDocumentsInPlace: false
        ITSAppUsesNonExemptEncryption: false
        FM1CloudSync: $(FM1_CLOUD_SYNC)
        FM1CloudContainer: $(FM1_CLOUD_CONTAINER)
        NSBluetoothAlwaysUsageDescription: Connects to Bluetooth MIDI controllers such as the M-VAVE SMC-PAD.
        NSMicrophoneUsageDescription: Records samples for the slice sampler.
        NSLocalNetworkUsageDescription: Finds the check-in server on your Mac, so your installs can see which firmware each has.
        NSBonjourServices: [_fm1checkin._tcp]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.fm1swapper.fwsc
            UTTypeDescription: FM-1 firmware package
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [fwsc]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: org.fm1swapper.song
            UTTypeDescription: FM-1 Swapper song
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [fm1song]
        CFBundleDocumentTypes:
          - CFBundleTypeName: FM-1 Swapper song
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [org.fm1swapper.song]
          - CFBundleTypeName: FM-1 firmware package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [org.fm1swapper.fwsc]
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        # iCloud sync: set to YES and CODE_SIGN_ENTITLEMENTS to App/FM1Swapper-iCloud.entitlements
        # once Xcode is signed in to the developer account (Settings > Accounts).
        FM1_CLOUD_SYNC: "NO"
